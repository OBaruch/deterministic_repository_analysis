[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-repository-audit"
version = "0.2.0"
description = "Deterministic, read-only quantitative audits for Git repositories"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Deterministic Repository Audit contributors" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["git", "audit", "cloc", "lines-of-code", "metrics", "reproducibility", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["ruff>=0.15", "mypy>=1.18"]

[project.urls]
Homepage = "https://github.com/OBaruch/deterministic_repository_analysis"
Documentation = "https://github.com/OBaruch/deterministic_repository_analysis/tree/main/docs"
Issues = "https://github.com/OBaruch/deterministic_repository_analysis/issues"
Changelog = "https://github.com/OBaruch/deterministic_repository_analysis/blob/main/CHANGELOG.md"

[project.scripts]
repo-audit = "repo_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_audit = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH"]
ignore = [
  "PLR0911",  # many early returns keep command dispatch flat
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",  # magic values are part of the Git and cloc protocols
  "PLC0415",  # optional PDF rendering is imported lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
"src/repo_audit/pdf.py" = ["E501"]  # embedded print stylesheet and cover markup
"tests/**" = ["PLR0904", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["repo_audit"]
known-local-folder = ["helpers"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict = true
warn_unreachable = true
